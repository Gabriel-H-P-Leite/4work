db_file            "~/.local/state/mpd/database"
sticker_file       "~/.local/state/mpd/sticker"
state_file         "~/.local/state/mpd/state"
auto_update "no"
restore_paused "yes"

audio_output {
        type            "pulse"
        name            "MPD"
}
audio_output {
   type   "fifo"
   name   "Visualizer"
   path   "/tmp/mpd.fifo"
   format "44100:16:2"
}
